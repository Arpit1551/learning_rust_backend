[package]
name = "actix_web"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
futures = "0.3.32"
jsonwebtoken = "9"
mongodb = "3.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
actix-multipart = "0.7"
futures-util = "0.3"
sha1 = "0.10"
base64 = "0.21"
actix-ws = "0.3"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time"] }
dotenvy = "0.15"
dashmap = "6.0"
